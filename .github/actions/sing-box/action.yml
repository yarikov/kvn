name: sing-box
description: Install a pinned sing-box release on PATH, so the runner tests validate generated configs with `sing-box check` instead of skipping it

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SING_BOX_VERSION: 1.14.3
        SING_BOX_SHA256: e2bdf179c15a3652955dc44867e33ca0965c9c9b91b34267dcc5a5d639a5feee
      run: |
        set -euo pipefail
        archive="sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
        curl -fsSLo "$RUNNER_TEMP/$archive" \
          "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${archive}"
        echo "${SING_BOX_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/sing-box-${SING_BOX_VERSION}-linux-amd64" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" version
