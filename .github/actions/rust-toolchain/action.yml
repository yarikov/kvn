name: Rust toolchain
description: Install the Rust version declared as rust-version in Cargo.toml and make it the active toolchain

inputs:
  components:
    description: Comma-separated rustup components to install
    required: false
    default: ''

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: |
        version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.version.outputs.version }}
        components: ${{ inputs.components }}
    - shell: bash
      run: echo "RUSTUP_TOOLCHAIN=${{ steps.version.outputs.version }}" >> "$GITHUB_ENV"
