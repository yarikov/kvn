name: AUR Deploy

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

jobs:
  aur:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: kvn-bin
            asset: kvn
            pkgdesc_suffix: ""
          - package: kvn-tui-bin
            asset: kvn-tui
            pkgdesc_suffix: " (transitional, replaced by kvn-bin)"
    steps:
      - uses: actions/checkout@v7

      - name: Get release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG=$(gh release view --json tagName -q '.tagName' --repo ${{ github.repository }})
          VERSION=${RELEASE_TAG#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions@github.com"

      - name: Add AUR to known hosts
        run: mkdir -p ~/.ssh && ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Clone AUR repo
        run: git clone ssh://aur@aur.archlinux.org/${{ matrix.package }}.git /tmp/aur

      - name: Read tarball checksum
        run: |
          TARBALL="${{ matrix.asset }}-${VERSION}-x86_64-linux.tar.gz"
          SHA256=$(curl -fsSL "https://github.com/yarikov/kvn/releases/download/v${VERSION}/checksums.txt" \
            | awk -v tarball="$TARBALL" '$2 == tarball { print $1 }')
          test -n "$SHA256"
          echo "SHA256=$SHA256" >> $GITHUB_ENV

      - name: Generate PKGBUILD
        run: |
          sed -e "s/{{PKGNAME}}/${{ matrix.package }}/g" \
              -e "s/{{ASSET}}/${{ matrix.asset }}/g" \
              -e "s/{{PKGDESC_SUFFIX}}/${{ matrix.pkgdesc_suffix }}/g" \
              -e "s/{{VERSION}}/${VERSION}/g" \
              -e "s/{{SHA256SUM}}/${SHA256}/g" \
              pkg/aur/PKGBUILD.bin > /tmp/aur/PKGBUILD
          cp pkg/aur/kvn-tui.install /tmp/aur/kvn-tui.install

      - name: Generate .SRCINFO
        run: |
          docker run --rm -v /tmp/aur:/aur -e RUNNER_UID=$(id -u) archlinux/archlinux bash -c "
            pacman -Sy --noconfirm pacman fakeroot
            useradd -m builder
            chown -R builder:builder /aur
            su builder -c 'cd /aur && makepkg --printsrcinfo > .SRCINFO'
            chown -R \$RUNNER_UID:\$RUNNER_UID /aur
          "

      - name: Commit and push to AUR
        run: |
          cd /tmp/aur
          git add PKGBUILD .SRCINFO kvn-tui.install
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(release): update to v${VERSION}"
          git push origin HEAD:master
